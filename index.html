<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중국어 학습 공간</title><link rel="stylesheet" href="style.css"></head><body><main><h1>中文学习空间 🇨🇳</h1><p>중국어 공부 · 복습 · 일기 · 학습 추적</p><nav><button onclick="tab('dashboard')">대시보드</button><button onclick="tab('cards')">플래시카드</button><button onclick="tab('diary')">일기</button><button onclick="tab('log')">학습 기록</button></nav><section id="dashboard"><h2>학습 대시보드</h2><div id="stats"></div><h3>자주 틀리는 표현</h3><div id="weakList"></div></section><section id="cards" hidden><h2>플래시카드</h2><input id="front" placeholder="중국어 표현"><textarea id="back" placeholder="뜻 · 예문 · 교정"></textarea><label><input id="weak" type="checkbox"> 자주 틀리는 표현</label><p><button onclick="addCard()">카드 추가</button></p><div id="cardList"></div></section><section id="diary" hidden><h2>중국어 일기</h2><input id="date" type="date"><textarea id="diaryText" placeholder="今天我..."></textarea><p><button onclick="saveEntry('diaries','diaryText')">일기 저장</button></p><div id="diaryList"></div></section><section id="log" hidden><h2>학습 기록</h2><textarea id="logText" placeholder="오늘 공부한 문장과 교정 내용을 붙여넣으세요"></textarea><p><button onclick="saveEntry('logs','logText')">기록 저장</button></p><div id="logList"></div></section><footer><p>데이터는 현재 브라우저에만 저장됩니다. ChatGPT 프로젝트 대화 자동 동기화 및 AI 교정은 아직 지원하지 않습니다.</p><button onclick="backup()">JSON 백업</button><input type="file" accept=".json" onchange="restore(event)"></footer></main><script src="app.js"></script></body></html>
